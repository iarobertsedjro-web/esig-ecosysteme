# =========================================================================
# ESIG — Modèle de vhost pour le SERVEUR B (Scaleway)
# HTTP uniquement, SANS SSL : le SSL/HSTS est géré par Nginx Proxy Manager
# (serveur A). Copier ce bloc pour CHACUN des 8 sous-domaines en adaptant
# UNIQUEMENT « server_name » et « root ».
#
# Sous-domaines : esig.tg · admission.esig.tg · executive.esig.tg ·
#   cooperation.esig.tg · carrieres.esig.tg · alumni.esig.tg ·
#   news.esig.tg · tech.esig.tg
# =========================================================================
server {
  listen 80;
  server_name esig.tg;              # ← ADAPTER par sous-domaine
  root /var/www/esig.tg;            # ← ADAPTER au même sous-domaine
  index index.html;

  # Assistant NOVA — même origine, proxifié vers le relais Node local
  location = /api/assistant {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  # Formulaires — même origine, proxifié vers le service Node local
  location = /api/formulaire {
    proxy_pass http://127.0.0.1:8788;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # En-têtes de sécurité (ou à poser dans NPM « Advanced » — sans doublon)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self' https://cloudflareinsights.com; form-action 'self' https:; frame-ancestors 'none'; base-uri 'self'" always;

  # Cache des actifs + compression
  location ~* \.(css|js|png|jpg|jpeg|webp|svg|ico|woff2?)$ { expires 30d; add_header Cache-Control "public"; }
  location = /sitemap.xml { expires 1d; }
  location = /robots.txt  { expires 1d; }
  gzip on; gzip_types text/css application/javascript application/json image/svg+xml;

  error_page 404 /404.html;
}

# =========================================================================
# Redirections des anciens sous-domaines (transition) — 301
# =========================================================================
server { listen 80; server_name international.esig.tg; return 301 https://cooperation.esig.tg$request_uri; }
server { listen 80; server_name entreprises.esig.tg;  return 301 https://carrieres.esig.tg$request_uri; }
